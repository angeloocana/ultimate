\* expect: ReportsOnlyWhenIdle
\* The busy check at send time for judged reports only, so a promoted note still woke a busy branch's starter.
SPECIFICATION Spec
CONSTANTS
    UsePredecessor = TRUE
    CheckEveryReport = FALSE
    MaxRestarts = 1
INVARIANTS
    AnswersInOrder
    SentOnce
    LastWordReported
    ReportsOnlyWhenIdle
